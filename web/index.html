<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sift | ASX value screener</title>
  <script>
    // Apply the saved theme before first paint so the page never flashes the wrong one.
    try {
      var saved = localStorage.getItem("sift-theme");
      if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
    } catch (e) { /* storage unavailable: follow the system setting */ }
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="Sift home">
        <span class="logo" aria-hidden="true">S</span>
        <span class="brand-name">Sift</span>
        <span class="brand-tag">ASX value screener</span>
      </a>
      <span class="asof" id="asof"></span>
      <div class="settings-wrap">
        <button class="icon-btn" id="settings-btn" type="button" aria-label="Settings" aria-expanded="false" aria-controls="settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
        <div class="settings" id="settings" role="dialog" aria-label="Settings" hidden>
          <h3>Settings</h3>
          <div class="label">Theme</div>
          <div class="segmented" role="group" aria-label="Theme">
            <button type="button" data-theme-choice="light">Light</button>
            <button type="button" data-theme-choice="dark">Dark</button>
            <button type="button" data-theme-choice="system">System</button>
          </div>
        </div>
      </div>
    </div>
  </header>
  <main id="app" aria-live="polite"><p class="loading">Loading...</p></main>
  <footer class="foot">Sift. Suggested actions are rule-based research prompts, not financial advice. Rules: docs/ASX_Value_Screener_Rules_and_Methodology.docx</footer>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
